<app-header></app-header>
<div class="categories-page" [class.loading]="!isPageLoaded()">
  <div class="container-custom">
    <!-- En-tête de la page -->
    <div class="page-header">
      <h1 class="page-title">Nos <span >Catégories</span></h1>
<!--      <p class="page-description">-->
<!--        Explorez nos différentes catégories de produits pour trouver exactement ce dont votre enfant a besoin-->
<!--      </p>-->
    </div>

    <!-- Catégories mises en avant -->
    <div class="featured-categories-section">
      <h2 class="section-title">Catégories <span >Populaires</span></h2>
      <div class="featured-categories-grid">
        <div
          *ngFor="let category of featuredCategories; let i = index"
          class="featured-category-card"
          [routerLink]="['/products']"
          [queryParams]="{category: category.id}"
          [style]="getCardIndex(i)"
        >
          <div class="featured-category-image-container">
            <img
              [src]="category.image"
              [alt]="category.name"
              class="featured-category-image"
            >

            <!-- Overlay -->
            <div class="featured-category-overlay"></div>

            <!-- Contenu -->
            <div class="featured-category-content">
              <div class="featured-category-header">
                <h3 class="featured-category-title">{{ category.name }}</h3>
                <span class="featured-category-badge">
                  {{ category.productCount }} produits
                </span>
              </div>

              <p class="featured-category-description">
                {{ category.description }}
              </p>

              <div class="featured-category-footer">
<!--                <span *ngIf="category.ageRange" class="age-range-badge">-->
<!--                  {{ category.ageRange }}-->
<!--                </span>-->
                <span class="discover-link">
                  Découvrir
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="cta-section">
      <div class="cta-container">
        <h3 class="cta-title">
          Besoin d'aide pour choisir ?
        </h3>
        <p class="cta-description">
          Notre équipe d'experts est là pour vous conseiller et vous aider à trouver les meilleurs produits pour votre enfant.
