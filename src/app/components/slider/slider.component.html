<section class="slider-container">
  <!-- Slides -->
  <div class="relative h-full">
    <div
      *ngFor="let slide of slides; let i = index"
      class="slide"
      [class.active]="i === currentSlide"
      [class.inactive]="i !== currentSlide"
      [ngStyle]="{ 'background': slide.backgroundColor }"
       >
      <!-- Image de fond -->
      <div
        class="slide-bg"
        [style.background-image]="'url(' + slide.image + ')'"
      ></div>



      <!-- Contenu du slide -->
      <div class="slide-content">
        <div class="slide-text">
          <h2 class="slide-title">
            {{ slide.title }}
          </h2>
          <p class="slide-subtitle">
            {{ slide.subtitle }}
          </p>
          <div class="pt-4">
            <a
              [routerLink]="slide.ctaLink"
              class="btn-primary"
            >
              {{ slide.ctaText }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Navigation précédent -->
  <button
    (click)="previousSlide()"
    (mouseenter)="pauseAutoSlide()"
    (mouseleave)="resumeAutoSlide()"
    class="slider-nav modern prev"
    aria-label="Slide précédent"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
    </svg>
  </button>

  <!-- Navigation suivant -->
  <button
    (click)="nextSlide()"
    (mouseenter)="pauseAutoSlide()"
    (mouseleave)="resumeAutoSlide()"
    class="slider-nav modern next"
    aria-label="Slide suivant"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>


  <!-- Indicateurs de slide -->
  <div class="slider-indicators">
    <button
      *ngFor="let slide of slides; let i = index"
      (click)="goToSlide(i)"
      (mouseenter)="pauseAutoSlide()"
      (mouseleave)="resumeAutoSlide()"
      class="slider-indicator"
      [class.active]="i === currentSlide"
      [attr.aria-label]="'Aller au slide ' + (i + 1)"
    ></button>
  </div>

  <!-- Bouton Pause/Play -->
  <button
    (click)="togglePlayPause()"
    class="slider-controls"
    aria-label="Play/Pause"
  >
    <!-- Icône Play -->
    <svg *ngIf="isPaused" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v14l11-7z"></path>
    </svg>

    <!-- Icône Pause -->
    <svg *ngIf="!isPaused" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    </svg>
  </button>


</section>
